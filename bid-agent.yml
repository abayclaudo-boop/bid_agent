name: Bid News Agent

# Triggers:
#   - Schedule: 3 times a day (06:00, 12:00, 18:00 UTC)
#     = 09:00, 15:00, 21:00 in East Africa Time (UTC+3)
#   - Manual: workflow_dispatch lets you click "Run workflow" in the
#     Actions tab for testing.
on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:

# Cancels any in-flight run if a new schedule fires.
concurrency:
  group: bid-agent-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Restore the SQLite dedupe DB so we don't re-send tenders that
      # were already notified in a previous run. The cache survives
      # between workflow runs (10 GB free, no expiry if used weekly).
      - name: Restore dedupe DB from cache
        uses: actions/cache@v4
        with:
          path: data/sent_items.db
          key:        bid-agent-dedupe-db
          restore-keys: |
            bid-agent-dedupe-db

      # Run one agent cycle. Reads secrets from the repo's
      # Settings → Secrets → Actions. Logs go to data/agent.log.
      - name: Run the agent
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_LOGIN_EMAIL:     ${{ secrets.SITE_LOGIN_EMAIL }}
          SITE_LOGIN_PASSWORD:  ${{ secrets.SITE_LOGIN_PASSWORD }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          USER_AGENT: "Mozilla/5.0 (compatible; BidNewsAgent/1.0)"
        run: |
          python bid_agent.py

      # Persist the updated dedupe DB back to cache for the next run.
      # `if: always()` ensures we save even on partial failures so we
      # don't lose already-sent tender IDs.
      - name: Save updated dedupe DB to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sent_items.db
          key:  bid-agent-dedupe-db

      # Optional: upload agent.log as a build artifact for easy
      # debugging from the Actions UI. Retained 14 days.
      - name: Attach agent.log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log
          path: data/agent.log
          retention-days: 14
