# =============================================================
# Bid News Agent — Configuration
# =============================================================
# Edit this file to point the agent at your target site and tune
# filtering behavior. Secrets (Telegram bot token, chat ID, and
# site login credentials) live in `.env` — never put secrets in
# this file.
# =============================================================

# --- Target website(s) ----------------------------------------
# Add more entries to the list to monitor multiple sources.
sites:
  - name: "2merkato Tenders"
    url: "https://tender.2merkato.com/tenders?categories=61bbe243cfb36d443e895a1b%2C61bbe243cfb36d443e8959f9&page=1&regions=&sources="

    # 2merkato is a Laravel + Inertia.js SPA. All tender data is
    # embedded server-side as JSON inside <div id="app" data-page="...">.
    # Use the inertia_json parser to extract it directly — no
    # browser rendering needed.
    parser: inertia_json
    json_path: "props.tenders.data"
    id_field: "id"
    title_field: "title"
    detail_url_template: "https://tender.2merkato.com/tenders/{id}"
    company_field: "company"
    deadline_field: "bid_closing_date_text"   # falls back to bid_closing_date if null
    deadline_iso_field: "bid_closing_date"     # raw ISO timestamp
    opening_date_field: "bid_opening_date_text"
    opening_date_iso_field: "bid_opening_date"
    published_at_field: "published_at"
    region_field: "region"
    sources_field: "sources"                    # array of {name_en, name_am, publication_date}
    bid_document_price_field: "bid_document_price"
    bid_bond_field: "bid_bond"

    # 2merkato hides bid dates / sources behind a paid subscription.
    # Login first so the agent's session cookie unlocks the full
    # data. Credentials come from .env (SITE_LOGIN_EMAIL +
    # SITE_LOGIN_PASSWORD). recaptcha is disabled on the site, so
    # automated login works.
    login:
      url: "https://tender.2merkato.com/login"
      action_url: "https://tender.2merkato.com/login"
      email_field: "emailOrMobile"   # accepts email OR phone (e.g. 0912345678)
      password_field: "password"
      csrf_field: "_token"

    use_browser: false

# --- AI filtering ---------------------------------------------
# The LLM is asked to judge each candidate item against this brief.
# The URL filter already restricts to the 2 vehicle-related
# categories (61bbe243cfb36d443e895a1b = "Vehicle (garage service)"
# and 61bbe243cfb36d443e8959f9). The brief makes the LLM focus on
# vehicle-related subject matter so framework/multi-category
# tenders are flagged only when they include vehicle work.
filter_brief: |
  Source site: tender.2merkato.com (Ethiopian procurement portal).
  The listing URL is pre-filtered to 2 categories:
    - "Vehicle (garage service)" — vehicle maintenance, repair,
      garage services, spare parts for vehicles.
    - "Vehicle purchase" — purchase of cars, trucks, buses,
      minibuses, motorcycles, tractors, or any motorized vehicle.

  Relevant tenders include:
    - Direct vehicle purchase (cars, trucks, minibuses, electric
      vehicles, motorcycles, etc.)
    - Vehicle maintenance / repair / garage services
    - Vehicle spare parts supply
    - Vehicle fuel / lubricant supply (when tied to a fleet)
    - Vehicle insurance (when tendered)
    - Framework agreements / prequalification notices that
      explicitly include vehicle purchase OR vehicle garage service
      as one of the covered categories.

  Not relevant (score 0):
    - Office supplies, IT equipment, stationary, hygiene kits,
      household materials, food, animal feed, printing, training,
      consultancy (unless explicitly vehicle-related)
    - Construction / civil works (unless tied to vehicle garages)

  Tenders are multilingual (Amharic + English). Judge relevance
  based on subject matter, not language.

# Minimum relevance score the LLM must return (0-100) for the
# item to qualify for notification. Higher = stricter.
min_relevance_score: 70

# --- Scheduling ------------------------------------------------
# Run interval in minutes. 30 = every 30 minutes.
run_interval_minutes: 30

# Cap items processed per run. 2merkato returns 15 per page.
max_items_per_run: 20

# --- Storage ---------------------------------------------------
# RELATIVE path — agent resolves it against the script's directory
# at runtime. Makes the agent portable across GitHub Actions,
# PythonAnywhere, VPS, and your local machine without editing.
db_path: "data/sent_items.db"

# --- Logging ---------------------------------------------------
# RELATIVE path — same rule.
log_file: "data/agent.log"
log_level: "INFO"   # DEBUG | INFO | WARNING | ERROR

# --- Telegram message format ----------------------------------
# Available placeholders (all auto-escaped for Markdown):
#   {title}         — tender title
#   {category}      — LLM-assigned category
#   {company_name}  — issuing organization (NEW)
#   {deadline}      — bid closing date (raw text or ISO)
#   {opening_date}  — bid opening date (NEW)
#   {published_at}  — publication date (NEW)
#   {region}        — region if known (NEW)
#   {source_name}   — publication source (e.g. Addis Zemen) (NEW)
#   {bid_doc_price} — cost to obtain tender documents (NEW)
#   {bid_bond}      — required bid bond / security (NEW)
#   {budget}        — LLM-extracted budget (often null)
#   {summary}       — LLM-generated detailed summary
#   {source_url}    — direct link to the tender detail page (RAW URL — not escaped)
#   {site_name}     — label from config
#   {found_at}      — UTC timestamp the agent picked up the item
message_template: |
  *📌 {title}*

  *🏢 Organization:* {company_name}
  *🏷 Category:* {category}
  *📅 Bid closing:* {deadline}
  *🔓 Bid opening:* {opening_date}
  *📰 Published:* {published_at}
  *📊 Source:* {source_name}
  *💵 Doc price:* {bid_doc_price}
  *🔒 Bid bond:* {bid_bond}
  *🌐 Region:* {region}

  *📋 Summary:*
  {summary}

  🔗 [View original tender]({source_url})
  _Spotted: {found_at}_
