name: Bid News Agent

# Triggers:
#   - Schedule: 3 times a day (06:00, 12:00, 18:00 UTC)
#     = 09:00, 15:00, 21:00 East Africa Time (UTC+3)
#   - Manual: workflow_dispatch lets you click "Run workflow" in the
#     Actions tab for testing.
on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:

# Don't cancel an in-flight run if a new schedule fires (prevents
# half-finished runs that could lose dedupe state).
concurrency:
  group: bid-agent-run
  cancel-in-progress: false

# contents: write — needed for the GitHub Pages deployment step
# (it pushes commits to the gh-pages branch).
# actions: write — needed for cache save.
# pages: write — needed to deploy to GitHub Pages.
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    # 25-min timeout. Groq is fast (~1s/call), but Gemini (fallback)
    # can be slow during demand spikes.
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # CRITICAL: use a UNIQUE key per run for save, with restore-keys
      # falling back to ANY previous bid-agent-dedupe-* entry.
      # We cache BOTH the SQLite dedupe DB AND the JSON log of sent
      # tenders (so the web dashboard persists between runs).
      - name: Restore dedupe DB + dashboard data from cache
        id: restore-cache
        uses: actions/cache@v4
        with:
          path: |
            data/sent_items.db
            data/tenders.jsonl
          key:        bid-agent-dedupe-${{ github.run_id }}
          restore-keys: |
            bid-agent-dedupe-

      # Make sure the data/ directory exists even if cache restore
      # missed (first-ever run) — prevents the agent from crashing
      # when it tries to open the SQLite DB.
      - name: Ensure data/ directory exists
        run: mkdir -p data

      # Run one agent cycle. Secrets are passed via env vars.
      # GROQ_API_KEY is the PRIMARY backend (fast + 1000 req/day).
      # GEMINI_API_KEY is the FALLBACK.
      - name: Run the agent
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_LOGIN_EMAIL:     ${{ secrets.SITE_LOGIN_EMAIL }}
          SITE_LOGIN_PASSWORD:  ${{ secrets.SITE_LOGIN_PASSWORD }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          USER_AGENT: "Mozilla/5.0 (compatible; BidNewsAgent/1.0)"
        run: |
          python bid_agent.py

      # Save the updated dedupe DB + tenders.jsonl to cache. Always
      # runs so we don't lose state even on partial failure.
      - name: Save dedupe DB + dashboard data to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/sent_items.db
            data/tenders.jsonl
          key: bid-agent-dedupe-${{ github.run_id }}

      # Deploy the static dashboard (data/index.html + tenders.jsonl)
      # to a `gh-pages` branch. GitHub Pages then serves it publicly
      # at https://<username>.github.io/<repo>/.
      #
      # Requires the user to enable Pages on the gh-pages branch in:
      #   Settings → Pages → Source: Deploy from a branch → gh-pages
      - name: Deploy dashboard to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy bid dashboard (run #${{ github.run_id }})'

      # Optional: upload agent.log as a downloadable artifact.
      - name: Attach agent.log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log
          path: data/agent.log
          if-no-files-found: ignore
          retention-days: 14
