name: Bid News Agent

on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: bid-agent-run
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure data/ directory exists
        run: mkdir -p data

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore dedupe DB from cache
        id: restore-cache
        uses: actions/cache@v4
        with:
          path: data/sent_items.db
          key: bid-agent-dedupe-${{ github.run_id }}
          restore-keys: |
            bid-agent-dedupe-

      - name: Run the agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_LOGIN_EMAIL: ${{ secrets.SITE_LOGIN_EMAIL }}
          SITE_LOGIN_PASSWORD: ${{ secrets.SITE_LOGIN_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOG_FILE: "data/agent.log"
          USER_AGENT: "Mozilla/5.0 (compatible; BidNewsAgent/1.0)"
        run: |
          python bid_agent.py

      - name: Save updated dedupe DB to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sent_items.db
          key: bid-agent-dedupe-${{ github.run_id }}

      - name: Attach agent.log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log
          path: data/agent.log
          if-no-files-found: ignore
          retention-days: 14
